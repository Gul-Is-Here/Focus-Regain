<!doctype html>
<!-- Play feature graphic, 1024x500. Run store_listing/render.sh after edits. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Jakarta; font-weight: 500; src: url(../../assets/fonts/PlusJakartaSans-500.ttf); }
  @font-face { font-family: Jakarta; font-weight: 800; src: url(../../assets/fonts/PlusJakartaSans-800.ttf); }
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; position: relative;
    font-family: Jakarta, sans-serif; color: #EEF2EC;
    background:
      radial-gradient(520px 420px at 78% 70%, rgba(97,135,100,.6), transparent 70%),
      radial-gradient(420px 300px at 0% 0%, rgba(156,176,128,.2), transparent 70%),
      linear-gradient(135deg, #1C262A 0%, #273338 100%);
  }
  /* Name and promise stay inside a 64px safe margin. */
  .brand { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
           display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; align-items: center; gap: 22px; }
  .row img { width: 92px; height: 92px; border-radius: 22px;
             box-shadow: 0 0 0 2px rgba(238,242,236,.10), 0 12px 30px rgba(0,0,0,.35); }
  h1 { margin: 0; font-weight: 800; font-size: 54px; letter-spacing: -1.2px; line-height: 1; }
  p { margin: 30px 0 0; font-weight: 500; font-size: 30px; line-height: 1.3; color: #B3C0B8; }
  p em { font-style: normal; color: #A9C08B; }
  /* The real dashboard, scaled evenly, rising from the bottom edge. */
  .screen { position: absolute; left: 618px; top: 64px; width: 330px; height: 436px;
            border-radius: 30px 30px 0 0; overflow: hidden;
            box-shadow: 0 0 0 2px rgba(238,242,236,.10), 0 20px 60px rgba(0,0,0,.45); }
  .screen img { display: block; width: 330px; margin-top: calc(-70px * 330 / 1080); }
</style>
</head>
<body>
  <div class="brand">
    <div class="row"><img src="logo.svg" alt=""><h1>Regain Focus</h1></div>
    <p>Track your screen time.<br><em>Block distractions.</em> Focus on what matters.</p>
  </div>
  <div class="screen"><img src="../raw/01_dashboard.png" alt=""></div>
</body>
</html>
