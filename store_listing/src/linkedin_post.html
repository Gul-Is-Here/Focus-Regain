<!doctype html>
<!-- LinkedIn feed image, 1200x1200 (1:1). Run store_listing/render.sh after edits. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Jakarta; font-weight: 500; src: url(../../assets/fonts/PlusJakartaSans-500.ttf); }
  @font-face { font-family: Jakarta; font-weight: 700; src: url(../../assets/fonts/PlusJakartaSans-700.ttf); }
  @font-face { font-family: Jakarta; font-weight: 800; src: url(../../assets/fonts/PlusJakartaSans-800.ttf); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 1200px; overflow: hidden; position: relative;
    font-family: Jakarta, sans-serif; color: #EEF2EC;
    background:
      radial-gradient(640px 760px at 92% 62%, rgba(97,135,100,.68), transparent 72%),
      radial-gradient(560px 420px at 0% 0%, rgba(156,176,128,.24), transparent 72%),
      linear-gradient(150deg, #182125 0%, #273338 100%);
  }
  .brand { position: absolute; top: 76px; left: 80px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 68px; height: 68px; border-radius: 17px;
               box-shadow: 0 0 0 2px rgba(238,242,236,.12); }
  .brand b { font-weight: 800; font-size: 36px; letter-spacing: -.6px; }
  h1 { position: absolute; top: 230px; left: 80px; margin: 0;
       font-weight: 800; font-size: 96px; line-height: 1.04; letter-spacing: -3px; }
  h1 em { font-style: normal; color: #B4CC93; }
  .lead { position: absolute; top: 462px; left: 80px; width: 540px; margin: 0;
          font-weight: 500; font-size: 31px; line-height: 1.36; color: #C4D0C9; }
  ul { position: absolute; top: 680px; left: 80px; width: 560px; margin: 0; padding: 0; list-style: none; }
  li { display: flex; align-items: center; gap: 22px; margin-bottom: 30px;
       font-weight: 700; font-size: 28px; line-height: 1.25; }
  li svg { flex: none; width: 58px; height: 58px; }
  .tag { position: absolute; bottom: 76px; left: 80px; padding: 11px 26px; border-radius: 999px;
         font-weight: 700; font-size: 25px; color: #C3D6A8;
         border: 2px solid rgba(169,192,139,.5); background: rgba(169,192,139,.1); }
  /* Real capture, scaled evenly; status bar trimmed. */
  .phone { position: absolute; left: 666px; top: 274px; padding: 13px 13px 0; background: #0E1417;
           border-radius: 60px 60px 0 0;
           box-shadow: 0 0 0 2px rgba(238,242,236,.16), 0 34px 90px rgba(0,0,0,.55); }
  .phone div { width: 460px; height: 913px; overflow: hidden; border-radius: 48px 48px 0 0; }
  .phone img { display: block; width: 460px; margin-top: calc(-70px * 460 / 1080); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="tick" viewBox="0 0 58 58">
      <rect width="58" height="58" rx="17" fill="#A9C08B" fill-opacity=".16" stroke="#A9C08B" stroke-opacity=".5" stroke-width="2"/>
      <path d="M17 30l8 8 16-17" fill="none" stroke="#C3D6A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>
  <div class="brand"><img src="logo.svg" alt=""><b>Regain Focus</b></div>
  <h1>Deep work,<br><em>protected.</em></h1>
  <p class="lead">Your best thinking needs quiet time. Your phone doesn't have to get in the way.</p>
  <ul>
    <li><svg><use href="#tick"/></svg>Block apps during work hours</li>
    <li><svg><use href="#tick"/></svg>Run timed focus sessions</li>
    <li><svg><use href="#tick"/></svg>Screen time stays on your phone</li>
  </ul>
  <span class="tag">For Android</span>
  <div class="phone"><div><img src="../raw/08_schedule.png" alt=""></div></div>
</body>
</html>
